services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kerala_trails
      POSTGRES_USER: kerala
      POSTGRES_PASSWORD: kerala_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerala -d kerala_trails"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
